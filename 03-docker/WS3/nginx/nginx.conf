events {}

http {
    upstream flask_cluster {
        server api1:5000;
        server api2:5000;
        server api3:5000;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://flask_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}